name: engine

on:
  push:
    paths:
      - 'packages/engine/**'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'packages/engine/**'
      - '.github/workflows/engine.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
